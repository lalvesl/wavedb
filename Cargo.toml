[workspace]
resolver = "2"
# Staged rebuild: `members` grows as each crate is implemented bottom-up. Crates
# still under construction (empty or bin-only targets) sit in `exclude` so the
# workspace resolves. Move a crate from `exclude` to `members` once it builds.
members = [
  "crates/seahash",
  "crates/wavedb-wire",
  "crates/wavedb-wire-derive",
  "crates/wavedb-wire-codegen",
  "crates/wavedb-platform",
  "crates/wavedb-core",
  "crates/wavedb-macros",
  "crates/wavedb-storage",
  "crates/wavedb-net",
  "crates/wavedb-quick-node",
  "crates/wavedb",
  "examples/contact-book",
  "examples/registry-size",
  "examples/schema-smoke",
  "examples/showcase",
  "crates/wavedb-wasm",
  "examples/todo-app/schema",
  "examples/todo-app/server",
  "examples/todo-app/client",
]
# The comparative benchmark (RFC 0060). Excluded deliberately and permanently:
# it links the competitor drivers (rusqlite today; mongodb/tokio-postgres/
# mysql_async in later phases), and none of those may enter the shipped
# dependency graph or `cargo deny check`'s audit surface.
exclude = ["benches"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
trivially_copy_pass_by_ref = "allow"

[workspace.dependencies]
# Shared versions; sub-crates pick what they need.
# The standalone Wire codec (pure value ⇄ bytes, no STRUCT_HASH). `wavedb-core`
# re-exports it as `wavedb_core::wire`.
wavedb-wire = { path = "crates/wavedb-wire" }
# Its companion `#[derive(WaveWire)]` proc-macro, re-exported by `wavedb-wire`.
wavedb-wire-derive = { path = "crates/wavedb-wire-derive" }
# The expansion both WaveWire derives share (a plain library, so the two
# proc-macro crates can call it).
wavedb-wire-codegen = { path = "crates/wavedb-wire-codegen" }
# The native ⇄ browser seam: wall clock, entropy, and the client half of the
# HTTP tunnel, one API compiled two ways (`SystemTime`/`TcpStream` vs
# `Date.now()`/`fetch`). Everything above it stays target-independent.
wavedb-platform = { path = "crates/wavedb-platform" }
thiserror = "2.0.21"
# RFC 0066 — the runtime pieces replacing tokio, one narrow crate each.
# Protocol code (HTTP tunnel, WebSocket codec) is generic over
# `embedded-io-async`, so the same code can sit on `embassy-net` someday;
# natively the socket is `async-io`'s, bridged by the adapter.
embedded-io-async = "0.7.0"
embedded-io-adapters = { version = "0.7.0", features = ["futures-03"] }
async-io = "2.6.0"
# `SO_REUSEPORT` for the node's per-thread listeners (RFC 0067 §6) — already
# in the tree under `async-io`, with the same features.
rustix = { version = "1.1.5", default-features = false, features = ["net", "process", "std"] }
# Queues: `embassy-sync` within one thread (no lock at all), lock-free
# `async-channel` across threads; `embassy-futures` for `select`.
embassy-sync = "0.8.0"
heapless = "0.9.3"
embassy-futures = "0.1.2"
async-channel = "2.5.0"
# Timers (`platform::time::sleep`), on its `std` driver natively; the browser
# keeps `setTimeout`. The generic queue takes any executor's `Waker` (the
# integrated one needs `embassy-executor`'s tasks). Past 128 pending timers
# it wakes one of them early, and an Embassy timer simply re-arms.
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-128"] }
# The executor (RFC 0066 step 4): one per carrier thread, on its `std`
# platform, whose `run_until` returns — so a carrier can end without `unsafe`.
embassy-executor = { version = "0.10.0", features = ["platform-std", "executor-thread"] }
zstd = "0.14.0"
byteorder = "1.5.0"
# The one hash function everywhere: STRUCT_HASH (fixed seed, compile-time type
# identity) + runtime Id/page routing (per-DB random seed in data.bin page 0).
# SeaHash is portable across arch/endianness for a given seed. PINNED EXACTLY:
# STRUCT_HASH identity is load-bearing, so a version bump that changed the
# algorithm would invalidate every stored record's type hash — never loosen `=`.
seahash = { path = "crates/seahash", version = "=4.1.0" }
proptest = "1.11.0"
criterion = { version = "0.8.2", features = ["async_tokio"] }
trybuild = "1.0.122"
tempfile = "3.27.0"
crc32fast = "1.5.2"
# Phase 11 — network transport
tokio-tungstenite = { version = "0.30.0", features = ["connect"] }
axum = "0.8.9"
# Loopback HTTP only — no TLS needed, and `default-tls` fails on systems
# without a system CA bundle (NixOS, minimal containers).  Disable
# default features so `Client::builder()` doesn't try to load roots.
reqwest = { version = "0.13.5", default-features = false }
bytes = "1.12.1"
fastbloom = "0.17.0"
futures-util = "0.3.34"
web-sys = { version = "0.3.106", features = [
  "WebSocket",
  "MessageEvent",
  "BinaryType",
  "Event",
  "ReadableStream",
  "TextDecoder",
] }
clap = { version = "4.6.7", features = ["derive"] }
hmac = "0.13"
# HTTPS to a public object store (RFC 0070, open question 1): rustls on
# the *ring* provider (aws-lc-rs, its default, needs cmake and a larger C
# build), and Mozilla's roots compiled in. Pinned to the release whose
# source was read before it was added (0.23.46: RUSTSEC-2026-0346 fixed in
# it, the diff from 0.23.45 read); a bump reads the diff first.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.9"
sha2 = "0.11"
# RFC 6455 accept key (the WS handshake pins SHA-1); same RustCrypto family
# as hmac/sha2. Never used for anything security-load-bearing.
sha1 = "0.11"
ratatui = "0.30"
crossterm = "0.29"
sysinfo = "0.39"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full", "extra-traits"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
# default-features off: the `json` default drags serde + serde_json into
# the wasm binary; WaveDB speaks its own wire format.
gloo-net = { version = "0.7.0", default-features = false, features = [
  "http",
  "websocket",
] }
js-sys = "0.3.106"
futures = "0.3.34"
wasm-bindgen-test = "0.3.79"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# Size-optimised wasm artifact — used by `nix build .#wasm` and
# scripts/wasm_size.sh.  Differences vs release: optimise for size, no
# debug info (line tables bloat .wasm), strip symbols, abort on panic
# (drops the unwinding machinery the browser can't use anyway).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
debug = false
strip = "symbols"
panic = "abort"

[profile.bench]
inherits = "release"
