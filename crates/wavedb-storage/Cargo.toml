[package]
name = "wavedb-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# `validation` turns on the crc32-framed checked wire encoding the journal and
# superblock persist with.
wavedb-core = { path = "../wavedb-core", features = ["validation"] }
# Direct dep (not just via core): `#[derive(WaveWire)]` expands to absolute
# `::wavedb_wire::` paths, so any crate deriving it must name the crate itself.
wavedb-wire.workspace = true
thiserror.workspace = true
# Page + journal-frame integrity checksums.
crc32fast.workspace = true
# Runtime Id/page-routing hash (per-DB random seed).
seahash.workspace = true
# Page compression against per-STRUCT_HASH raw-content dictionaries.
zstd.workspace = true
# Streams for the search walk over the Store seam.
futures.workspace = true
# The object-store client half (RFC 0070): an object-backed store uploads
# its pages through it.
wavedb-platform.workspace = true

[features]
# The settle-round probe (`src/probe.rs`): one line per round naming what
# its window holds, for chasing an issue in a test or a bench. Off by
# default; a build without it compiles none of it.
probe = []

[dev-dependencies]
# The object-store tests run against a local versitygw.
wavedb-platform = { workspace = true, features = ["test-server"] }
tempfile.workspace = true
# The NonUnique end-to-end test drives the real derived collection API.
wavedb-macros = { path = "../wavedb-macros" }
