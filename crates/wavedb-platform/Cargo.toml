[package]
name = "wavedb-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
# `select` for `time::timeout`, the same on both targets.
embassy-futures.workspace = true

# Native: the client half of the dumb tunnel is a hand-rolled HTTP/1.1 POST
# over a fresh TcpStream (no HTTP stack — WaveDB uses no HTTP semantics);
# the WebSocket client half is a hand-rolled RFC 6455 exchange in the same
# stance. `sha1` is the handshake's pinned accept-key digest — not a
# security boundary, just the RFC.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The timer behind `time::sleep` (RFC 0066 step 3).
embassy-time.workspace = true
# Carrier threads: one Embassy executor each (`carrier`, RFC 0066 step 4).
embassy-executor.workspace = true
sha1.workspace = true
# RFC 0066: the socket (`async-io`) and the I/O traits every protocol layer
# above is generic over (`embedded-io-async`), bridged by the adapter.
async-io.workspace = true
embedded-io-async.workspace = true
embedded-io-adapters.workspace = true
futures.workspace = true

# Browser: the same seams over the web APIs — `Date.now()`, `fetch` +
# `Request` with a streamed response body, `crypto.getRandomValues`, and
# the browser's own `WebSocket` object (it frames RFC 6455 itself).
# `futures` only bridges WebSocket events into an awaitable `recv()`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
futures.workspace = true
web-sys = { workspace = true, features = [
  "BinaryType",
  "CloseEvent",
  "Crypto",
  "Headers",
  "MessageEvent",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Request",
  "RequestInit",
  "Response",
  "WebSocket",
  "Window",
] }

# Linux: the node's listeners form one `SO_REUSEPORT` group, which the kernel
# balances (`listen`, RFC 0067 §6). Elsewhere a group is one listener.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix.workspace = true
