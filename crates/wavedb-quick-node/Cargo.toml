[package]
name = "wavedb-quick-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "wavedb_quick_node"
path = "src/lib.rs"

[dependencies]
# The node owns the storage engine and dispatches through the core exposure
# surface; net supplies the request/response envelopes and HTTP framing.
wavedb-core = { path = "../wavedb-core" }
wavedb-storage = { path = "../wavedb-storage" }
wavedb-net = { path = "../wavedb-net" }
# Entropy for the default per-boot signing secret, and the sockets
# (`wavedb_platform::io`, RFC 0066).
wavedb-platform.workspace = true
# The I/O traits the serve loop is generic over (RFC 0066).
embedded-io-async.workspace = true
# Bounded queues (RFC 0066 step 2): `embassy-sync` within a thread,
# `async-channel` across threads, `futures` one-shot replies, and
# `embassy-futures` to select between them.
embassy-sync.workspace = true
embassy-futures.workspace = true
async-channel.workspace = true
futures.workspace = true
# The executor until RFC 0066 step 4 replaces it; sockets, channels and
# timers no longer come from here (`sync` stays for `OwnerLocks`, RFC 0067).
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "sync", "time"] }
tempfile.workspace = true
wavedb-net = { path = "../wavedb-net" }
# Integration tests drive the node with real `#[wavedb]` structs + a REGISTRY.
schema-smoke = { path = "../../examples/schema-smoke" }
