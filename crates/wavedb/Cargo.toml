[package]
name = "wavedb"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

# The schema side features exist here only because this crate's own
# integration tests act as a schema crate (tests/server_fn_e2e.rs expands
# `#[server]` + `expose_*!`, whose emission gates on the *invoking* crate's
# features). Library code never reads them; app schema crates declare their
# own pair.
[features]
default = ["server-side", "client-side"]
server-side = []
client-side = []

[dependencies]
# The client re-exports core types + the derive macros (so downstream schema
# crates use one dependency, `wavedb`), and talks to a node over `wavedb-net`.
wavedb-core = { path = "../wavedb-core" }
wavedb-macros = { path = "../wavedb-macros" }
wavedb-net = { path = "../wavedb-net" }
# `#[derive(WaveWire)]` (via #[wavedb]) expands absolute ::wavedb_wire:: paths.
wavedb-wire.workspace = true
thiserror.workspace = true
# Refresh tokens are stored hashed (sha256) in the session record.
sha2.workspace = true
# Stream/StreamExt re-exported through the prelude for collection iterators.
futures.workspace = true

# `wavedb::auth` declares its session records with #[wavedb], whose native
# expansion emits per-type storage slots; `Db::open`'s native cache is the
# node's engine, on a carrier of its own that ticks its settle (RFC 0072
# §11): an Embassy task from `wavedb-platform`, reached across threads by
# `async-channel`, selecting with `embassy-futures`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wavedb-storage = { path = "../wavedb-storage" }
wavedb-platform.workspace = true
async-channel.workspace = true
embassy-futures.workspace = true

# `Db::open`'s browser cache is the IndexedDB `Store` backend (`IdbStore`:
# one `kv` object store, `Id → wire bytes`, event-driven requests bridged
# to futures via a oneshot channel per operation).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
  "DomException",
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "Window",
] }

[dev-dependencies]
# `carrier::block_on` drives the integration tests (RFC 0066).
wavedb-platform.workspace = true
tempfile.workspace = true
futures.workspace = true
# End-to-end tests drive a real node with a real schema crate + REGISTRY.
wavedb-quick-node = { path = "../wavedb-quick-node" }
schema-smoke = { path = "../../examples/schema-smoke" }
# The #[server]/#[wavedb]/expose_server! expansions in the server-fn E2E test
# emit `::wavedb_storage::` paths (the per-type storage slots + registry).
wavedb-storage = { path = "../wavedb-storage" }
