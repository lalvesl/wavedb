[package]
name = "wavedb-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Deliberately OUTSIDE the workspace (`workspace.exclude` in the root
# `Cargo.toml`): the competitor drivers must never enter the shipped dependency
# graph or `cargo deny check`'s audit surface. See RFC 0060 §5.
[workspace]
# `gen/` sits inside this directory but is its own workspace: its source and
# lock must not include this crate's (see `gen/Cargo.toml`).
exclude = ["gen"]

[lib]
name = "wavedb_bench"
path = "src/lib.rs"

[features]
default = ["servers"]
# The server bracket (RFC 0060 §2). Optional so the embedded bracket builds
# without three database clients. It was introduced for `bench-gen`, which has
# since moved to its own crate (`gen/`) and needs no gate at all; the
# `--no-default-features` build stays in the bar because the gates it checks
# are still here.
servers = ["dep:mongodb", "dep:postgres", "dep:mysql", "dep:tokio"]
# The storage engine's probe (wavedb-storage `probe`): a row run with it
# logs every window it writes and its reads, phase by phase, and records
# nothing.
probe = ["wavedb-storage/probe"]

[dependencies]
# The schema and the seed fill, in a crate of their own so that `bench-gen`'s
# source is only what it compiles (see `gen/src/lib.rs`).
wavedb-bench-gen = { path = "gen" }
wavedb-core = { path = "../crates/wavedb-core" }
wavedb-macros = { path = "../crates/wavedb-macros" }
wavedb-storage = { path = "../crates/wavedb-storage" }
# block_on for the engine's non-Send futures (current-thread model), and the
# one-shot reply the disk actor answers on.
futures = "0.3"
# System SQLite, NOT `bundled` — the version must come from `flake.lock` like
# every other competitor, which is the whole point of RFC 0060 §7.
rusqlite = "0.40"
# The server-bracket drivers, all **synchronous** APIs. The workload is one
# connection issuing one operation at a time (§3), so an async client would add
# a runtime and buy nothing; `mongodb`'s `sync` feature is its own blocking
# wrapper, and `postgres`/`mysql` are blocking crates by construction.
postgres = { version = "0.19.14", optional = true }
mysql = { version = "28.0.3", optional = true }
# Spelled out rather than defaulted, and both halves of that are forced. The
# crate `compile_error!`s without a TLS backend, a bson version and its
# forward-compatibility flag — but its default set also pulls `dns-resolver`,
# whose `hickory-proto ^0.26` has no stable release, so `default-features` does
# not resolve at all. Nothing here needs DNS: the URI is a loopback address.
mongodb = { version = "3.9.1", optional = true, default-features = false, features = [
  "sync",
  "bson-3",
  "rustls-tls",
  "compat-3-3-0",
] }
# `mongodb`'s `sync` wrapper builds a multi-thread tokio runtime but does not
# ask for that feature itself. The node used to enable it by accident (its
# tokio inherited `full`); since RFC 0066 nothing of ours links tokio, so the
# driver's need is spelled out here, on the driver's side of the fence.
tokio = { version = "1.53.2", optional = true, default-features = false, features = [
  "rt-multi-thread",
] }

[profile.release]
debug = true

[[bin]]
name = "bench-row"
path = "src/bin/bench-row.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
