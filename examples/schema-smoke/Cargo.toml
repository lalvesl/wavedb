[package]
name = "schema-smoke"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# The schema side features the expose macros gate on (see todo-app-schema
# for the full story). Both on by default — this crate's tests exercise both
# registries; `wavedb-wasm`'s browser test pulls `client-side` only.
[features]
default = ["server-side", "client-side"]
server-side = ["dep:wavedb-quick-node"]
client-side = []

[dependencies]
wavedb-core = { path = "../../crates/wavedb-core" }
wavedb-macros = { path = "../../crates/wavedb-macros" }

# `#[wavedb]` emits each type's native storage slot (`StructStorage` statics),
# so on non-wasm targets a schema crate links the engine crate defining it.
# The wasm expansion omits the slots — no storage dep there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wavedb-storage = { path = "../../crates/wavedb-storage" }
# `expose_server!` declares the node's tasks for this crate's registry
# (RFC 0066): they live in static pools, which need the concrete type.
wavedb-quick-node = { path = "../../crates/wavedb-quick-node", optional = true }

[dev-dependencies]
# block_on + stream combinators for the collection-flow smoke test.
futures.workspace = true
