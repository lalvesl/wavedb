[package]
name = "contact-book"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# The schema side features (see todo-app-schema for the full story): both on
# by default for this crate's own tests and its `node` example; the browser
# demo (`wavedb-wasm` dev-dep) pulls `client-side` only, so no `#[server]`
# body ever reaches the wasm artifact.
[features]
default = ["server-side", "client-side"]
server-side = ["dep:futures"]
client-side = []

[dependencies]
wavedb = { path = "../../crates/wavedb" }
# The derive-emitted code names ::wavedb_core:: paths directly.
wavedb-core = { path = "../../crates/wavedb-core" }
# Stream combinators for the index-backed `contacts_in` read (server body).
futures = { workspace = true, optional = true }

# `#[wavedb]` emits each type's native storage slot (`StructStorage`
# statics), so on non-wasm targets a schema crate links the engine crate
# defining it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wavedb-storage = { path = "../../crates/wavedb-storage" }

[dev-dependencies]
wavedb-quick-node = { path = "../../crates/wavedb-quick-node" }
# The e2e test signs its own access token against the node's fixed secret.
wavedb-net = { path = "../../crates/wavedb-net" }
tokio.workspace = true
# `time::timeout` for the waits that must not hang a run.
wavedb-platform.workspace = true
tempfile.workspace = true
futures.workspace = true
