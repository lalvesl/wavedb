[package]
name = "todo-app-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Server side only: the client stubs and their registry are not compiled
# into the node binary — the two sides are asymmetric on purpose.
todo-app-schema = { path = "../schema", default-features = false, features = [
  "server-side",
] }
wavedb-quick-node = { path = "../../../crates/wavedb-quick-node" }
# `carrier::block_on` runs this (RFC 0066).
wavedb-platform.workspace = true
# Binary-level error reporting (apps aren't layers; anyhow is fine here).
anyhow = "1"
