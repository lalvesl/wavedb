[package]
name = "todo-app-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Client side only: `#[server]` bodies, the node dispatch, and the
# server-only helpers are NOT compiled into this binary. The guarantee
# applies to this package's own build graph (`cargo build -p
# todo-app-client`) — a `--workspace` build unifies features with the
# schema's default-on test build.
todo-app-schema = { path = "../schema", default-features = false, features = [
  "client-side",
] }
wavedb = { path = "../../../crates/wavedb" }
# `carrier::block_on` runs this (RFC 0066).
wavedb-platform.workspace = true
# Binary-level error reporting (apps aren't layers; anyhow is fine here).
anyhow = "1"
